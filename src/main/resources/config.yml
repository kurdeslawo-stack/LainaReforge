settings:
  require-confirmation: true
  allow-unknown-items: false
  debug: false

development:
  # Tylko do lokalnych testow. Przed wydaniem produkcyjnym ustaw false.
  enabled: true

item-identification:
  # Docelowo wpiszemy tutaj prawdziwy klucz customowych itemow z Lainy.
  # /reforge inspect pokazuje klucze PDC przedmiotu trzymanego w rece.
  pdc-string-keys:
    - "laina:item_id"
  allow-material-fallback: false

gui:
  title: "LainaReforge - Recykling"

currency:
  shard-material: AMETHYST_SHARD
  shard-name: "&dOdłamek Customu"
  nugget-material: NETHERITE_SCRAP
  nugget-name: "&6Bryłka Reforge"
  shards-per-nugget: 32

logging:
  transactions: true

recycling:
  default-value: 0
  blacklisted-ids: []

  # Domyslna wartosc itemu wynika z jego tieru.
  tiers:
    common: 1
    uncommon: 2
    rare: 4
    epic: 8
    legendary: 12

  # Konkretne itemy przypisujemy do tierow. Pole shards jest opcjonalnym nadpisaniem.
  items:
    example_common_item:
      tier: common
    example_rare_item:
      tier: rare
    example_legendary_item:
      tier: legendary
      shards: 16

messages:
  prefix: "&8[&dLainaReforge&8] &7"
  no-permission: "&cNie masz uprawnien do tej komendy."
  reloaded: "&aKonfiguracja zostala przeladowana."
  unknown-item: "&cTego przedmiotu nie mozna przetopic."
  recycled: "&aPrzetopiono przedmioty. Otrzymano &d{shards} &aodlamkow."
