settings:
  require-confirmation: true
  allow-unknown-items: false
  debug: false

development:
  # Tylko do lokalnych testow. Przed wydaniem produkcyjnym ustaw false.
  enabled: true

item-identification:
  # Docelowo wpiszemy tutaj prawdziwy klucz customowych itemow z Lainy.
  # /reforge inspect pokazuje klucze PDC przedmiotu trzymanego w rece.
  pdc-string-keys:
    - "laina:item_id"
  allow-material-fallback: false

gui:
  title: "LainaReforge - Recykling"

currency:
  shard-material: AMETHYST_SHARD
  shard-name: "&dOdłamek Customu"
  nugget-material: NETHERITE_SCRAP
  nugget-name: "&6Bryłka Reforge"
  shards-per-nugget: 32

logging:
  transactions: true

# Moj dodatek: LainaReforge sam buduje kolejke nowych customow.
# Jesli gracz sprobuje przetopic rozpoznany, ale jeszcze nieskonfigurowany item,
# plugin NIE niszczy go. Zapisuje ID, material, gracza i liczbe wykryc do pending-items.yml.
# Po dopisaniu itemu do recycling.items wpis automatycznie znika przy /reforge reload.
discovery:
  enabled: true
  file: "pending-items.yml"
  record-cooldown-seconds: 60

recycling:
  # Bezpieczny tryb: item musi byc jawnie wpisany do sekcji items albo starej sekcji values.
  require-registered-item: true
  default-value: 0

  # Pojedyncze ID, ktorych nigdy nie wolno przetapiac.
  blacklisted-ids: []

  # Kategorie zgodne z zalozeniem Ezo: ekwipunek tak, waluty/specjalne przedmioty nie.
  blocked-categories:
    - currency
    - token
    - event_collectible
    - special_crystal
    - quest_item

  categories:
    equipment:
      recyclable: true
    weapon:
      recyclable: true
    tool:
      recyclable: true
    armor:
      recyclable: true
    currency:
      recyclable: false
    token:
      recyclable: false
    event_collectible:
      recyclable: false
    special_crystal:
      recyclable: false
    quest_item:
      recyclable: false

  # Domyslna wartosc itemu wynika z jego tieru.
  tiers:
    common: 1
    uncommon: 2
    rare: 4
    epic: 8
    legendary: 12

  # Kazdy custom dostaje kategorie i tier.
  # shards pozwala nadpisac wartosc, recyclable: false blokuje pojedynczy item.
  items:
    example_common_item:
      category: equipment
      tier: common

    example_rare_item:
      category: weapon
      tier: rare

    example_legendary_item:
      category: weapon
      tier: legendary
      shards: 16

    # Przyklady rzeczy, ktorych wedlug zalozen serwera nie wolno przetapiac.
    example_event_token:
      category: event_collectible
      tier: rare

    example_special_crystal:
      category: special_crystal
      tier: epic

    example_manual_block:
      category: equipment
      tier: epic
      recyclable: false

messages:
  prefix: "&8[&dLainaReforge&8] &7"
  no-permission: "&cNie masz uprawnien do tej komendy."
  reloaded: "&aKonfiguracja zostala przeladowana."
  unknown-item: "&cTego przedmiotu nie mozna przetopic."
  recycled: "&aPrzetopiono przedmioty. Otrzymano &d{shards} &aodlamkow."
